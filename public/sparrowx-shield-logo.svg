<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shieldSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="38%" stop-color="#E2E8F0" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="shieldRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5" />
      <stop offset="35%" stop-color="#F87171" />
      <stop offset="72%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="shieldArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E222B" />
      <stop offset="55%" stop-color="#181B22" />
      <stop offset="100%" stop-color="#121418" />
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="56" fill="url(#shieldGlow)" />

  <!-- Tactical Aegis Falcon Shoulder Wings -->
  <path d="M10 34 L38 40 L34 52 L16 46 Z" fill="url(#shieldRed)" />
  <path d="M118 34 L90 40 L94 52 L112 46 Z" fill="url(#shieldRed)" />

  <!-- Outer Faceted 3D Moonlit Silver Shield -->
  <path d="M64 14 L104 30 L100 72 C97 94 64 114 64 114 C64 114 31 94 28 72 L24 30 Z" fill="url(#shieldSilver)" stroke="#F8FAFC" stroke-width="1" stroke-opacity="0.7" />

  <!-- Recessed Charcoal Gray Core Shield -->
  <path d="M64 23 L95 35 L92 70 C89 87 64 103 64 103 C64 103 39 87 36 70 L33 35 Z" fill="url(#shieldArmor)" stroke="#CBD5E1" stroke-width="1.2" stroke-opacity="0.65" />

  <!-- Center Vertical Bevel Seam (3D Faceting) -->
  <path d="M64 23 L64 103" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.55" />

  <!-- Active Signal Red Radar Rings & Hawk Chevron -->
  <circle cx="64" cy="58" r="19" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="18 8" opacity="0.9" />
  <circle cx="64" cy="58" r="11" stroke="#F87171" stroke-width="1.5" opacity="0.8" />
  <path d="M51 54 L64 42 L77 54 L64 66 Z" fill="url(#shieldRed)" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.9" />
  <circle cx="64" cy="54" r="3" fill="#FFFFFF" />
</svg>
