  <path d="M64 16 L76 30 L69 30 L69 48 L59 48 L59 30 L52 30 Z" fill="#FFFFFF" fill-opacity="0.95" stroke="#22D3EE" stroke-width="1.5" />

  <!-- Vault Keyhole / Lock Badge on Front Ridge -->
