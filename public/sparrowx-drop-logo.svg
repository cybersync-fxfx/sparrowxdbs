  <path d="M18 68 L40 56 L40 67 L25 76 Z" fill="url(#dropWing)" opacity="0.75" />
  <path d="M116 52 L86 36 L88 50 L110 63 Z" fill="url(#dropWing)" opacity="0.95" />
  <path d="M110 68 L88 56 L88 67 L103 76 Z" fill="url(#dropWing)" opacity="0.75" />

