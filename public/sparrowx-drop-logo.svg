  <polygon points="64,34 94,50 64,66 34,50" fill="url(#dropTopFace)" stroke="#ECFEFF" stroke-width="1.5" stroke-opacity="0.85" />
  <polygon points="34,50 64,66 64,102 34,86" fill="url(#dropLeftFace)" stroke="#67E8F9" stroke-width="1.4" stroke-opacity="0.7" />
  <polygon points="94,50 64,66 64,102 94,86" fill="url(#dropRightFace)" stroke="#6EE7B7" stroke-width="1.4" stroke-opacity="0.7" />

