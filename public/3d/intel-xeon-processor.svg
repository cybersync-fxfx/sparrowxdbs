<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background & Ambient Intel Blue Glow -->
    <radialGradient id="intelBlueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0071C5" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#00A3E0" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#002D62" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Substrate (High-Density Server Blue PCB Base) -->
    <linearGradient id="intelPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081E38" />
      <stop offset="50%" stop-color="#0A2A52" />
      <stop offset="100%" stop-color="#051529" />
    </linearGradient>

    <!-- Metallic Enterprise Heat Spreader Top -->
    <linearGradient id="xeonIhs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="25%" stop-color="#475569" />
      <stop offset="60%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Heat Spreader Polished Beveled Edge -->
    <linearGradient id="xeonBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Intel Electric Blue Circuit Glow -->
    <linearGradient id="intelCyanGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0071C5" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Gold Contact Pads / LGA Array -->
    <linearGradient id="xeonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <filter id="xeonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Blue Halo behind Enterprise Chip -->
  <circle cx="300" cy="300" r="260" fill="url(#intelBlueGlow)" />

  <!-- 3D Transform Container Group -->
  <g transform="translate(300, 300) rotate(10) scale(0.96) translate(-300, -300)">
    <!-- Drop Shadow on Server Chassis -->
    <ellipse cx="310" cy="460" rx="200" ry="40" fill="#000000" opacity="0.7" filter="url(#xeonBlur)" />

    <!-- 1. Enterprise Substrate PCB (Oblong Server LGA Form Factor) -->
    <rect x="100" y="120" width="400" height="360" rx="20" fill="url(#intelPcb)" stroke="#0071C5" stroke-width="2" />
    <!-- High-density Interconnect Circuit Traces -->
    <rect x="108" y="128" width="384" height="344" rx="16" fill="none" stroke="url(#intelCyanGleam)" stroke-width="1.2" stroke-dasharray="16 6" opacity="0.6" />

    <!-- Gold Alignment Triangles & Keying Notches -->
    <polygon points="115,135 145,135 115,165" fill="url(#xeonGold)" />
    <!-- Retention Notches -->
    <rect x="88" y="270" width="16" height="60" rx="4" fill="#060C16" stroke="#0071C5" stroke-width="1.5" />
    <rect x="496" y="270" width="16" height="60" rx="4" fill="#060C16" stroke="#0071C5" stroke-width="1.5" />

    <!-- Gold Edge Contact Array (LGA Edge Fingers) -->
    <g fill="url(#xeonGold)">
      <rect x="170" y="124" width="6" height="12" rx="1" />
      <rect x="182" y="124" width="6" height="12" rx="1" />
      <rect x="194" y="124" width="6" height="12" rx="1" />
      <rect x="206" y="124" width="6" height="12" rx="1" />
      <rect x="388" y="124" width="6" height="12" rx="1" />
      <rect x="400" y="124" width="6" height="12" rx="1" />
      <rect x="412" y="124" width="6" height="12" rx="1" />
      <rect x="424" y="124" width="6" height="12" rx="1" />
    </g>

    <!-- 2. Dual-Plate Enterprise Heat Spreader (IHS) -->
    <!-- Bevel 3D Shadow -->
    <rect x="136" y="152" width="328" height="296" rx="16" fill="url(#xeonBevel)" opacity="0.9" />

    <!-- Main Nickel-Plated Copper Heat Spreader Face -->
    <rect x="140" y="148" width="320" height="288" rx="14" fill="url(#xeonIhs)" stroke="#94A3B8" stroke-width="1.8" />

    <!-- Brushed Steel Horizontal Polish Lines -->
    <line x1="148" y1="200" x2="452" y2="200" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1" />
    <line x1="148" y1="260" x2="452" y2="260" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1" />
    <line x1="148" y1="320" x2="452" y2="320" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1" />
    <line x1="148" y1="380" x2="452" y2="380" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1" />

    <!-- 3. Intel & Xeon Gold Laser Etching -->
    <!-- Intel Blue Ring Element / Cyber Hub -->
    <circle cx="300" cy="245" r="46" fill="none" stroke="url(#intelCyanGleam)" stroke-width="6" stroke-dasharray="140 25 35 15" stroke-linecap="round" filter="url(#xeonBlur)" />
    <circle cx="300" cy="245" r="46" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2" />

    <!-- Intel Core Emblem -->
    <text x="300" y="254" font-family="'Inter', 'Helvetica Neue', system-ui, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="1" text-anchor="middle">
      intel
    </text>

    <!-- Typography: XEON GOLD -->
    <text x="300" y="325" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="26" fill="#F8FAFC" letter-spacing="4" text-anchor="middle">
      XEON GOLD
    </text>

    <!-- Gold Accent Tagline -->
    <text x="300" y="355" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="800" font-size="16" fill="url(#xeonGold)" letter-spacing="4" text-anchor="middle">
      DUAL PROCESSOR ENTERPRISE
    </text>

    <!-- Architecture & Hardware Specs -->
    <text x="300" y="388" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="2" text-anchor="middle">
      DUAL-SOCKET &#8226; DDR4 ECC &#8226; 99.99% SLA
    </text>

    <!-- Laser Etched Serial Numbers -->
    <text x="156" y="174" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B" letter-spacing="1.2">
      INTEL &#174; XEON &#174; GOLD &#8226; SPARROWX ENTERPRISE CLOUD
    </text>
    <text x="156" y="186" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#475569">
      SRL9Z 2.80GHZ &#8226; L428H902 &#8226; MADE IN COSTA RICA
    </text>
  </g>
</svg>