<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none">
  <defs>
    <radialGradient id="vpsBg" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="56%" stop-color="#0369A1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#05060A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kvmTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="kvmLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="kvmRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C4A6E" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#08101C"/>
    </linearGradient>
    <filter id="cyanBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
<circle cx="320" cy="316" r="260" fill="url(#vpsBg)"/>

  <!-- Base fiber grid -->
  <ellipse cx="320" cy="534" rx="188" ry="36" fill="#38BDF8" fill-opacity="0.16" filter="url(#cyanBloom)"/>

  <!-- Back Top KVM Cube -->
  <g transform="translate(230, 108)">
    <polygon points="90,0 180,48 90,96 0,48" fill="url(#kvmTop)" stroke="#7DD3FC" stroke-width="2"/>
    <polygon points="0,48 90,96 90,192 0,144" fill="url(#kvmLeft)" stroke="#334155" stroke-width="1.5"/>
    <polygon points="180,48 90,96 90,192 180,144" fill="url(#kvmRight)" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="90" cy="48" r="10" fill="#38BDF8" filter="url(#cyanBloom)"/>
  </g>

  <!-- Left Lower KVM Cube -->
  <g transform="translate(106, 258)">
    <polygon points="90,0 180,48 90,96 0,48" fill="url(#kvmTop)" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="0,48 90,96 90,192 0,144" fill="url(#kvmLeft)" stroke="#334155" stroke-width="1.5"/>
    <polygon points="180,48 90,96 90,192 180,144" fill="url(#kvmRight)" stroke="#0EA5E9" stroke-width="1.5"/>
    <line x1="22" y1="88" x2="72" y2="115" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" filter="url(#cyanBloom)"/>
  </g>

  <!-- Right Lower KVM Cube -->
  <g transform="translate(354, 258)">
    <polygon points="90,0 180,48 90,96 0,48" fill="url(#kvmTop)" stroke="#34D399" stroke-width="2"/>
    <polygon points="0,48 90,96 90,192 0,144" fill="url(#kvmLeft)" stroke="#334155" stroke-width="1.5"/>
    <polygon points="180,48 90,96 90,192 180,144" fill="url(#kvmRight)" stroke="#34D399" stroke-width="1.5"/>
    <line x1="108" y1="115" x2="158" y2="88" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" filter="url(#cyanBloom)"/>
  </g>

  <!-- Center Foreground KVM Master Cube -->
  <g transform="translate(230, 328)">
    <polygon points="90,0 180,48 90,96 0,48" fill="url(#kvmTop)" stroke="#BAE6FD" stroke-width="2.2"/>
    <polygon points="0,48 90,96 90,192 0,144" fill="url(#kvmLeft)" stroke="#475569" stroke-width="1.6"/>
    <polygon points="180,48 90,96 90,192 180,144" fill="url(#kvmRight)" stroke="#38BDF8" stroke-width="1.8"/>
    <polygon points="90,22 134,46 90,70 46,46" fill="#38BDF8" fill-opacity="0.3" stroke="#E0F2FE" stroke-width="1.8" filter="url(#cyanBloom)"/>
  </g>

  <!-- Glowing Fiber Interconnects -->
  <line x1="256" y1="244" x2="210" y2="290" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" filter="url(#cyanBloom)"/>
  <line x1="384" y1="244" x2="430" y2="290" stroke="#34D399" stroke-width="3" stroke-linecap="round" filter="url(#cyanBloom)"/>
</svg>
