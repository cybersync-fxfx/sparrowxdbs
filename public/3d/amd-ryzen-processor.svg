<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background & Ambient Glow -->
    <radialGradient id="amdRedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1A1A" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#ED1C24" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Substrate (Greenish-Gold PCB Base) -->
    <linearGradient id="pcbBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2A1C" />
      <stop offset="40%" stop-color="#2D3E2A" />
      <stop offset="100%" stop-color="#141C13" />
    </linearGradient>

    <!-- Metallic Heat Spreader Top -->
    <linearGradient id="ihsTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555D69" />
      <stop offset="35%" stop-color="#363C47" />
      <stop offset="70%" stop-color="#22262E" />
      <stop offset="100%" stop-color="#181B22" />
    </linearGradient>

    <!-- Heat Spreader Beveled Edge -->
    <linearGradient id="ihsBevel" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0E1015" />
      <stop offset="50%" stop-color="#2F3540" />
      <stop offset="100%" stop-color="#6A7382" />
    </linearGradient>

    <!-- Gold Pin/Capacitor Accents -->
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="50%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#996D19" />
    </linearGradient>

    <!-- Ryzen Fiery Glow -->
    <linearGradient id="ryzenFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA200" />
      <stop offset="50%" stop-color="#FF2A00" />
      <stop offset="100%" stop-color="#B80000" />
    </linearGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Red Halo behind Chip -->
  <circle cx="300" cy="300" r="260" fill="url(#amdRedGlow)" />

  <!-- 3D Transform Container Group -->
  <g transform="translate(300, 300) rotate(-12) scale(0.96) translate(-300, -300)">
    <!-- Drop Shadow on Motherboard -->
    <ellipse cx="310" cy="460" rx="200" ry="40" fill="#000000" opacity="0.65" filter="url(#neonBlur)" />

    <!-- 1. PCB Substrate (Bottom Layer) -->
    <rect x="110" y="110" width="380" height="380" rx="24" fill="url(#pcbBase)" stroke="#455B3F" stroke-width="2.5" />
    <!-- Gold Substrate Border Trace -->
    <rect x="116" y="116" width="368" height="368" rx="20" fill="none" stroke="url(#goldGleam)" stroke-width="1.5" stroke-dasharray="14 4" opacity="0.75" />

    <!-- Golden Pin 1 Triangle (Corner Index) -->
    <polygon points="124,124 156,124 124,156" fill="url(#goldGleam)" />

    <!-- Exposed SMD Capacitors on AM5 Perimeter Cutouts -->
    <!-- Top Cutout & Capacitors -->
    <rect x="250" y="118" width="100" height="18" rx="4" fill="#0A0F09" />
    <g fill="url(#goldGleam)">
      <rect x="256" y="122" width="10" height="10" rx="1" />
      <rect x="272" y="122" width="10" height="10" rx="1" />
      <rect x="288" y="122" width="10" height="10" rx="1" />
      <rect x="304" y="122" width="10" height="10" rx="1" />
      <rect x="320" y="122" width="10" height="10" rx="1" />
      <rect x="336" y="122" width="10" height="10" rx="1" />
    </g>

    <!-- Bottom Cutout & Capacitors -->
    <rect x="250" y="464" width="100" height="18" rx="4" fill="#0A0F09" />
    <g fill="url(#goldGleam)">
      <rect x="256" y="468" width="10" height="10" rx="1" />
      <rect x="272" y="468" width="10" height="10" rx="1" />
      <rect x="288" y="468" width="10" height="10" rx="1" />
      <rect x="304" y="468" width="10" height="10" rx="1" />
      <rect x="320" y="468" width="10" height="10" rx="1" />
      <rect x="336" y="468" width="10" height="10" rx="1" />
    </g>

    <!-- 2. Integrated Heat Spreader (Octopus-Leg AM5 IHS) -->
    <!-- Bevel 3D Extrusion Shadow -->
    <rect x="144" y="148" width="312" height="312" rx="20" fill="url(#ihsBevel)" opacity="0.9" />

    <!-- Main Metallic Heat Spreader Face -->
    <rect x="148" y="144" width="304" height="304" rx="18" fill="url(#ihsTop)" stroke="#687385" stroke-width="2" />

    <!-- Brushed Texture Subtle Lines -->
    <line x1="154" y1="200" x2="446" y2="200" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
    <line x1="154" y1="260" x2="446" y2="260" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
    <line x1="154" y1="320" x2="446" y2="320" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
    <line x1="154" y1="380" x2="446" y2="380" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

    <!-- 3. RYZEN Fiery Laser-Etched Graphic (Center) -->
    <!-- Glowing Ring / Zen Enso Fire Circle -->
    <circle cx="300" cy="275" r="58" fill="none" stroke="url(#ryzenFire)" stroke-width="8" stroke-dasharray="190 40 50 20" stroke-linecap="round" filter="url(#neonBlur)" />
    <circle cx="300" cy="275" r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Core AMD Chevron in Center -->
    <path d="M290 260 L315 275 L290 290 Z" fill="url(#ryzenFire)" />

    <!-- Typography: AMD RYZEN -->
    <text x="300" y="360" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">
      AMD RYZEN
    </text>

    <!-- Typography: 9 9950X -->
    <text x="300" y="392" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="800" font-size="20" fill="#ED1C24" letter-spacing="6" text-anchor="middle">
      9 9950X
    </text>

    <!-- Spec Badging -->
    <text x="300" y="420" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#8F9CAE" letter-spacing="2.5" text-anchor="middle">
      ZEN 5 &#8226; 16C / 32T &#8226; 5.7GHz &#8226; AM5
    </text>

    <!-- Laser Etched Serial Top -->
    <text x="165" y="172" font-family="'JetBrains Mono', monospace" font-size="8" fill="#5F6B7D" letter-spacing="1.5">
      DIFFUSED IN TAIWAN &#8226; MADE IN MALAYSIA
    </text>
    <text x="165" y="184" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#4B5666">
      100-000001234 &#8226; 2435PXY &#8226; SPARROWX-NODE-01
    </text>
  </g>
</svg>