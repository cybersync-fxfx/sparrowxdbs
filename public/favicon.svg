<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="sx-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#F05A28" />
      <stop offset="100%" stop-color="#D83B01" />
    </linearGradient>
    <linearGradient id="sx-eye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A" />
      <stop offset="100%" stop-color="#FF453A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield/Circle Base -->
  <rect width="128" height="128" rx="28" fill="#09090b" />
  <rect width="126" height="126" x="1" y="1" rx="27" stroke="url(#sx-red)" stroke-width="2" stroke-opacity="0.4" />

  <!-- SparrowX Cyber Hawk Silhouette -->
  <g transform="translate(14, 16) scale(0.78)">
    <!-- Top Crest Wing -->
    <path d="M12 28 L40 32 L94 42 C98 52, 94 62, 88 70 L62 50 L28 42 Z" fill="url(#sx-red)" />
    <!-- Rear Feather Sharp Spine -->
    <path d="M2 18 L24 22 L16 34 L6 30 Z" fill="url(#sx-red)" />
    <path d="M10 38 L30 44 L20 62 L8 52 Z" fill="url(#sx-red)" />
    <path d="M18 56 L38 62 L32 82 L22 72 Z" fill="url(#sx-red)" />

    <!-- Head & Beak -->
    <path d="M36 28 C62 30, 96 38, 108 58 C116 70, 114 86, 104 98 C102 92, 102 82, 94 76 C84 70, 72 68, 56 64 C42 60, 36 48, 36 28 Z" fill="#FFFFFF" />
    <!-- Cyber Beak Hook -->
    <path d="M94 76 C104 76, 112 80, 112 90 C112 98, 106 104, 102 108 C100 102, 100 94, 94 90 Z" fill="url(#sx-red)" />
    <!-- Dark Hawk Mask -->
    <path d="M46 38 C64 42, 84 48, 92 62 C86 64, 76 66, 62 64 C50 62, 46 50, 46 38 Z" fill="#18181b" />
    <!-- Glowing Cyber Eye -->
    <ellipse cx="80" cy="56" rx="6" ry="3.5" transform="rotate(-12 80 56)" fill="url(#sx-eye)" filter="url(#glow)" />
  </g>
</svg>
