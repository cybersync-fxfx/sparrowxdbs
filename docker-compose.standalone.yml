# ==============================================================================
# SPARROWX TECHNOLOGIES — STANDALONE DEDICATED SERVER BLUEPRINT (DEBIAN/UBUNTU)
# ==============================================================================
# Complete Full-Stack Architecture:
#  1. sparrowx-postgres     : PostgreSQL 16 + pgvector (5 Isolated Databases)
#  2. sparrowx-pgbouncer    : Transaction Connection Pooler (Port 6543)
#  3. sparrowx-postgrest    : Instant REST API Gateway (api.<domain>)
#  4. sparrowx-threat-cache : Redis 7 Threat & Ephemeral Drop Cache
#  5. sparrowx-studio       : SparrowX Full-Stack App (Hub, DB, Shield, Drop, Keys)
#  6. sparrowx-edge-proxy   : Nginx SSL Reverse Proxy (Ports 80 & 443 + ACME)
# ==============================================================================

networks:
  sparrowx_net:
    name: sparrowx_net
    driver: bridge

volumes:
  sparrowx_pgdata:
    driver: local
  sparrowx_redis_data:
    driver: local
  sparrowx_file_storage:
    driver: local

services:
  sparrowx-postgres:
    image: pgvector/pgvector:pg16
    container_name: sparrowx_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sparrowbase}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - sparrowx_pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sparrowbase}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sparrowx_net

  sparrowx-pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: sparrowx_pgbouncer
    restart: always
    ports:
      - "127.0.0.1:${PG_POOL_PORT:-6543}:6543"
    environment:
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - DB_HOST=sparrowx-postgres
      - DB_PORT=5432
      - DB_NAME=*
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=5000
      - DEFAULT_POOL_SIZE=80
      - LISTEN_PORT=6543
      - AUTH_TYPE=scram-sha-256
    depends_on:
      sparrowx-postgres:
        condition: service_healthy
    networks:
      - sparrowx_net

  sparrowx-postgrest:
    image: postgrest/postgrest:latest
    container_name: sparrowx_postgrest
    restart: always
    ports:
      - "127.0.0.1:${PGRST_HOST_PORT:-3001}:3000"
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@sparrowx-pgbouncer:6543/${POSTGRES_DB:-sparrowbase}
      PGRST_DB_SCHEMA: ${PGRST_DB_SCHEMA:-public}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-web_anon}
      PGRST_JWT_SECRET: ${SPARROWX_JWT_SECRET:?SPARROWX_JWT_SECRET must be set in .env}
      PGRST_OPENAPI_SERVER_PROXY_URI: https://${DOMAIN_API:-api.sparrowx.net}
    depends_on:
      - sparrowx-pgbouncer
    networks:
      - sparrowx_net

  sparrowx-threat-cache:
    image: redis:7-alpine
    container_name: sparrowx_threat_cache
    restart: always
    command: redis-server --appendonly yes --requirepass ${SPARROWX_REDIS_SECRET:-secret_redis_pass_123}
    volumes:
      - sparrowx_redis_data:/data
    networks:
      - sparrowx_net

  sparrowx-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparrowx_studio
    restart: always
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - VITE_APP_URL=https://${DOMAIN_STUDIO:-db.sparrowx.net}
      - SITE_URL=https://${DOMAIN_ROOT:-sparrowx.net}
      - PUBLIC_URL=https://${DOMAIN_ROOT:-sparrowx.net}
      - APP_URL=https://${DOMAIN_ROOT:-sparrowx.net}
      - VITE_SITE_URL=https://${DOMAIN_ROOT:-sparrowx.net}
      - VITE_API_URL=https://${DOMAIN_API:-api.sparrowx.net}
      - VITE_SUPABASE_URL=https://${DOMAIN_API:-api.sparrowx.net}
      - VITE_SPARROWX_API_URL=https://${DOMAIN_API:-api.sparrowx.net}
      - VITE_SPARROWX_WS_URL=wss://${DOMAIN_API:-api.sparrowx.net}/realtime
      - POSTGREST_HOST=sparrowx-postgrest
      - POSTGREST_PORT=3000
      - POSTGREST_INTERNAL_URL=http://sparrowx-postgrest:3000
      - SPARROWX_DB_REST_URL=http://sparrowx-postgrest:3000
      - SPARROWX_DATA_DIR=/app/data
      - SPARROWX_DOMAIN=${DOMAIN_ROOT:-sparrowx.net}
      - SPARROWX_PUBLIC_IP=${SPARROWX_PUBLIC_IP:-127.0.0.1}
      - SPARROWX_ADMIN_EMAIL=${SPARROWX_ADMIN_EMAIL:-admin@sparrowx.net}
      - DOMAIN_ROOT=${DOMAIN_ROOT:-sparrowx.net}
      - DOMAIN_STUDIO=${DOMAIN_STUDIO:-db.sparrowx.net}
      - DOMAIN_API=${DOMAIN_API:-api.sparrowx.net}
      - DOMAIN_SEC=${DOMAIN_SEC:-sec.sparrowx.net}
      - DOMAIN_FILE=${DOMAIN_FILE:-file.sparrowx.net}
      - DOMAIN_PASSWORD=${DOMAIN_PASSWORD:-password.sparrowx.net}
      - ADDITIONAL_REDIRECT_URLS=https://${DOMAIN_ROOT:-sparrowx.net}/**,https://www.${DOMAIN_ROOT:-sparrowx.net}/**,https://${DOMAIN_STUDIO:-db.sparrowx.net}/**,https://${DOMAIN_SEC:-sec.sparrowx.net}/**,https://${DOMAIN_FILE:-file.sparrowx.net}/**,https://${DOMAIN_PASSWORD:-password.sparrowx.net}/**
      - GOTRUE_SITE_URL=https://${DOMAIN_STUDIO:-db.sparrowx.net}
    volumes:
      - sparrowx_file_storage:/app/data/storage
      - ./data:/app/data
    depends_on:
      - sparrowx-postgrest
      - sparrowx-threat-cache
    networks:
      - sparrowx_net

  sparrowx-edge-proxy:
    image: nginx:1.27-alpine
    container_name: sparrowx_edge_proxy
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./ovh/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ovh/ssl:/etc/nginx/ssl:ro
      - ./ovh/certbot-www:/var/www/certbot:ro
    depends_on:
      - sparrowx-studio
      - sparrowx-postgrest
    networks:
      - sparrowx_net
