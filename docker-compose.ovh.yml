# ============================================================================
# SPARROWX FULL-STACK SELF-HOSTED COMPOSE (OVH UBUNTU SERVER)
# ============================================================================
# All host ports dynamically adapt via .env (HTTP_PORT, HTTPS_PORT,
# PG_HOST_PORT, PGRST_HOST_PORT, APP_HOST_PORT) so port conflicts never occur.
# ============================================================================

networks:
  sparrowx_net:
    name: sparrowx_net
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: sparrowx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sparrowx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sparrowx_ovh_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sparrowx_db}
    volumes:
      - sparrowx_pgdata:/var/lib/postgresql/data
      - ./ovh/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sparrowx} -d ${POSTGRES_DB:-sparrowx_db} || pg_isready -U postgres || pg_isready -q"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      sparrowx_net:
        aliases:
          - postgres
          - sparrowx-postgres

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: sparrowx-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-sparrowx}:${POSTGRES_PASSWORD:-sparrowx_ovh_secret_2026}@postgres:5432/${POSTGRES_DB:-sparrowx_db}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_PORT: 3001
    ports:
      - "127.0.0.1:${PGRST_HOST_PORT:-3001}:3001"
    networks:
      sparrowx_net:
        aliases:
          - postgrest
          - sparrowx-postgrest

  sparrowx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparrowx-app
    restart: unless-stopped
    depends_on:
      - postgrest
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      POSTGREST_HOST: postgrest
      POSTGREST_PORT: 3001
      POSTGREST_INTERNAL_URL: http://postgrest:3001
      SPARROWX_DB_REST_URL: http://postgrest:3001
      SPARROWX_DATA_DIR: /app/data
      SPARROWX_DOMAIN: ${SPARROWX_DOMAIN:-localhost}
      SPARROWX_PUBLIC_IP: ${SPARROWX_PUBLIC_IP:-127.0.0.1}
      SPARROWX_NS1: ${SPARROWX_NS1:-ns1.localhost}
      SPARROWX_NS2: ${SPARROWX_NS2:-ns2.localhost}
      SPARROWX_ADMIN_EMAIL: ${SPARROWX_ADMIN_EMAIL:-admin@localhost}
      SPARROWX_HTTP_PORT: ${HTTP_PORT:-80}
      SPARROWX_HTTPS_PORT: ${HTTPS_PORT:-443}
      VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-}
      # Game Hosting Portal (/game & /game/dashboard)
      POSTGREST_URL: ${POSTGREST_URL:-http://postgrest:3001}
      POSTGREST_API_KEY: ${POSTGREST_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      PTERO_URL: ${PTERO_URL:-https://game.panel.sparrowx.net}
      PTERO_APPLICATION_API_KEY: ${PTERO_APPLICATION_API_KEY:-}
      PTERO_CLIENT_API_KEY: ${PTERO_CLIENT_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    volumes:
      - sparrowx_appdata:/app/data
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    networks:
      sparrowx_net:
        aliases:
          - sparrowx
          - sparrowx-app
          - sparrowx-studio

  nginx:
    image: nginx:1.27-alpine
    container_name: sparrowx-nginx
    restart: unless-stopped
    depends_on:
      - sparrowx
      - postgrest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./ovh/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ovh/ssl:/etc/nginx/ssl:ro
      - ./ovh/certbot-www:/var/www/certbot:ro
    networks:
      sparrowx_net:
        aliases:
          - nginx
          - sparrowx-nginx
          - sparrowx-edge-proxy

volumes:
  sparrowx_pgdata:
  sparrowx_appdata:
