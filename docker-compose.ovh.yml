# ============================================================================
# SPARROWX FULL-STACK SELF-HOSTED COMPOSE (OVH UBUNTU SERVER)
# ============================================================================
# All host ports dynamically adapt via .env (HTTP_PORT, HTTPS_PORT,
# PG_HOST_PORT, PGRST_HOST_PORT, APP_HOST_PORT) so port conflicts never occur.
# ============================================================================

networks:
  sparrowx_net:
    name: sparrowx_net
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: sparrowx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sparrowx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sparrowx_db}
    volumes:
      - sparrowx_pgdata:/var/lib/postgresql/data
      - ./ovh/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sparrowx} -d ${POSTGRES_DB:-sparrowx_db} || pg_isready -U postgres || pg_isready -q"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      sparrowx_net:
        aliases:
          - postgres
          - sparrowx-postgres

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: sparrowx-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-sparrowx}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-sparrowx_db}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_PORT: 3001
    ports:
      - "127.0.0.1:${PGRST_HOST_PORT:-3001}:3001"
    networks:
      sparrowx_net:
        aliases:
          - postgrest
          - sparrowx-postgrest

  sparrowx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparrowx-app
    restart: unless-stopped
    depends_on:
      - postgrest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
      - path: /etc/sparrowx/app.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      POSTGREST_HOST: postgrest
      POSTGREST_PORT: 3001
      POSTGREST_INTERNAL_URL: http://postgrest:3001
      SPARROWX_DB_REST_URL: http://postgrest:3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-sparrowx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sparrowx_db}
      SPARROWX_DB_PUBLIC_HOST: db.${SPARROWX_DOMAIN:-sparrowx.net}
      PG_HOST_PORT: ${PG_HOST_PORT:-5432}
      SPARROWX_DATA_DIR: /app/data
      SPARROWX_DOMAIN: ${SPARROWX_DOMAIN:-localhost}
      SPARROWX_PUBLIC_IP: ${SPARROWX_PUBLIC_IP:-127.0.0.1}
      SPARROWX_NS1: ${SPARROWX_NS1:-ns1.localhost}
      SPARROWX_NS2: ${SPARROWX_NS2:-ns2.localhost}
      SPARROWX_ADMIN_EMAIL: ${SPARROWX_ADMIN_EMAIL:-admin@localhost}
      SPARROWX_JWT_SECRET: ${SPARROWX_JWT_SECRET:?SPARROWX_JWT_SECRET must be set in .env}
      SPARROWX_MASTER_SSO_SECRET: ${SPARROWX_MASTER_SSO_SECRET:-${SPARROWX_JWT_SECRET:?SPARROWX_JWT_SECRET must be set in .env}}
      SPARROWX_HTTP_PORT: ${HTTP_PORT:-80}
      SPARROWX_HTTPS_PORT: ${HTTPS_PORT:-443}
      # Game Hosting Portal (/game & /game/dashboard)
      POSTGREST_URL: ${POSTGREST_URL:-http://postgrest:3001}
      SESSION_SECRET: ${SESSION_SECRET:-${SPARROWX_JWT_SECRET:?SPARROWX_JWT_SECRET must be set in .env}}
      PTERO_URL: ${PTERO_URL:-https://game.panel.sparrowx.net}
      PTERO_INTERNAL_URL: ${PTERO_INTERNAL_URL:-http://host.docker.internal:${PTERO_PORT:-8090}}
      # Self-Hosted SparrowX Pay Gateway defaults (secrets loaded via env_file .env + /etc/sparrowx/app.env)
      SPARROWX_UPI_ID: ${SPARROWX_UPI_ID:-bm.atchuthakrishna@okhdfcbank}
      SPARROWX_MERCHANT_NAME: ${SPARROWX_MERCHANT_NAME:-SparrowX Technologies}
      SPARROWX_INR_PER_USDT: ${SPARROWX_INR_PER_USDT:-86}
      # Self-Hosted Open-Source SMTP (Postfix + OpenDKIM) & Email Verification
      SMTP_HOST: ${SMTP_HOST:-smtp}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-SparrowX Security <noreply@${SPARROWX_DOMAIN:-sparrowx.net}>}
      SMTP_HELO_DOMAIN: ${SPARROWX_DOMAIN:-sparrowx.net}
    volumes:
      - sparrowx_appdata:/app/data
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    networks:
      sparrowx_net:
        aliases:
          - sparrowx
          - sparrowx-app
          - sparrowx-studio

  smtp:
    image: boky/postfix:latest
    container_name: sparrowx-smtp
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: ${SPARROWX_DOMAIN:-sparrowx.net}
      HOSTNAME: mail.${SPARROWX_DOMAIN:-sparrowx.net}
      DKIM_AUTOGENERATE: "1"
      DKIM_SELECTOR: ${SMTP_DKIM_SELECTOR:-mail}
      RELAYHOST: ${SMTP_RELAYHOST:-}
      RELAYHOST_USERNAME: ${SMTP_RELAYHOST_USER:-}
      RELAYHOST_PASSWORD: ${SMTP_RELAYHOST_PASS:-}
      POSTFIX_myhostname: mail.${SPARROWX_DOMAIN:-sparrowx.net}
      POSTFIX_smtputf8_enable: "no"
    volumes:
      - ./ovh/dkim:/etc/opendkim/keys
    networks:
      sparrowx_net:
        aliases:
          - smtp
          - sparrowx-smtp
          - mail

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: sparrowx-phpmyadmin
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PMA_HOST: ${PMA_HOST:-host.docker.internal}
      PMA_PORT: ${PMA_PORT:-3306}
      PMA_ARBITRARY: "0"
      PMA_ABSOLUTE_URI: "https://php.sparrowx.net/"
      UPLOAD_LIMIT: 128M
    networks:
      sparrowx_net:
        aliases:
          - phpmyadmin
          - sparrowx-phpmyadmin

  nginx:
    image: nginx:1.27-alpine
    container_name: sparrowx-nginx
    restart: unless-stopped
    depends_on:
      - sparrowx
      - postgrest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./ovh/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ovh/ssl:/etc/nginx/ssl:ro
      - ./ovh/certbot-www:/var/www/certbot:ro
    networks:
      sparrowx_net:
        aliases:
          - nginx
          - sparrowx-nginx
          - sparrowx-edge-proxy

volumes:
  sparrowx_pgdata:
  sparrowx_appdata:
