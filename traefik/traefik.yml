# ==============================================================================
# SPARROWX TECHNOLOGIES — TRAEFIK v3 STATIC CONFIGURATION (COOLIFY / OVH 64GB)
# ==============================================================================
# Wildcard TLS (Let's Encrypt DNS-01 via Cloudflare), HTTP/2 + HTTP/3 (QUIC),
# Trusted Proxy Real-IP Hygiene, and Zero-Trust Admin Isolation.
#
# Required .env variables (NEVER hardcode secrets):
#   CF_DNS_API_TOKEN=<cloudflare-scoped-dns-edit-token>
#   ACME_EMAIL=security@sparrowx.net
# ==============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  format: json

accessLog:
  format: json
  bufferingSize: 100
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Referer: keep
        X-Forwarded-For: keep
        X-Real-IP: keep
        Cf-Connecting-Ip: keep
        Host: keep

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    forwardedHeaders:
      trustedIPs:
        # Localhost & Docker / WireGuard internal ranges
        - "127.0.0.1/32"
        - "10.66.0.0/16"
        - "172.16.0.0/12"
        # Cloudflare IPv4 Edge Ranges (https://www.cloudflare.com/ips-v4)
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        # Cloudflare IPv6 Edge Ranges (https://www.cloudflare.com/ips-v6)
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"

  websecure:
    address: ":443"
    asDefault: true
    http3:
      advertisedPort: 443
    transport:
      respondingTimeouts:
        # Allow long-lived SSE / WebSocket streams (n8n, AI chat, deployment logs, Pterodactyl console)
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 180s
    http:
      tls:
        options: default
        certResolver: letsencrypt
        domains:
          - main: "sparrowx.net"
            sans:
              - "*.sparrowx.net"
          - main: "ai.sparrowx.net"
            sans:
              - "*.ai.sparrowx.net"
          - main: "deploy.sparrowx.net"
            sans:
              - "*.deploy.sparrowx.net"
    forwardedHeaders:
      trustedIPs:
        - "127.0.0.1/32"
        - "10.66.0.0/16"
        - "172.16.0.0/12"
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: sparrowx_net
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "security@sparrowx.net"
      storage: /letsencrypt/acme.json
      keyType: EC384
      dnsChallenge:
        provider: cloudflare
        propagation:
          delayBeforeChecks: 15s
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
