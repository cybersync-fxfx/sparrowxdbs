# ==============================================================================
# SPARROWX ENTERPRISE INFRASTRUCTURE (NGINX PROXY MANAGER OPTIMIZED)
# ==============================================================================
# Multi-VPS & Dedicated Server architecture:
# - NPM is hosted on external reverse-proxy VPS.
# - SparrowX is hosted on internal VPS (e.g., 10.10.10.10).
# - SparrowX Web / Studio:     0.0.0.0:80 & 3000 (sec.sparrowx.net & db.sparrowx.net)
# - SparrowX PostgREST API:   0.0.0.0:3001      (api.sparrowx.net)
# - SparrowX PgBouncer:       0.0.0.0:6543      (Postgres Connection Pooler)
# - SparrowX PostgreSQL:      127.0.0.1:5432    (Internal DB)
# ==============================================================================

networks:
  sparrowx_net:
    name: sparrowx_net
    driver: bridge

volumes:
  sparrowx_pgdata:
    driver: local
  sparrowx_redis_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. SparrowX PostgreSQL 16 with pgvector AI extension
  # ----------------------------------------------------------------------------
  sparrowx-postgres:
    image: pgvector/pgvector:pg16
    container_name: sparrowx_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sparrowbase}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SparrowxMasterSecretPass2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - sparrowx_pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - sparrowx_net

  # ----------------------------------------------------------------------------
  # 2. PgBouncer Connection Pooler (Port 6543)
  # ----------------------------------------------------------------------------
  sparrowx-pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: sparrowx_pgbouncer
    restart: always
    ports:
      - "6543:6543"
    environment:
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-SparrowxMasterSecretPass2026!}
      - DB_HOST=sparrowx-postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-sparrowbase}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=5000
      - DEFAULT_POOL_SIZE=80
      - LISTEN_PORT=6543
      - AUTH_TYPE=scram-sha-256
    networks:
      - sparrowx_net
    depends_on:
      - sparrowx-postgres

  # ----------------------------------------------------------------------------
  # 3. PostgREST REST API Gateway (Port 3001 -> forwarded to api.sparrowx.net)
  # ----------------------------------------------------------------------------
  sparrowx-postgrest:
    image: postgrest/postgrest:latest
    container_name: sparrowx_postgrest
    restart: always
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-SparrowxMasterSecretPass2026!}@sparrowx-pgbouncer:6543/${POSTGRES_DB:-sparrowbase}
      PGRST_DB_SCHEMA: ${PGRST_DB_SCHEMA:-public,auth,storage}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-anon}
      PGRST_JWT_SECRET: ${SPARROWX_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-sparrowx}
      PGRST_OPENAPI_SERVER_PROXY_URI: https://${DOMAIN_API:-api.sparrowx.net}
    networks:
      - sparrowx_net
    depends_on:
      - sparrowx-pgbouncer

  # ----------------------------------------------------------------------------
  # 4. Redis Threat Cache
  # ----------------------------------------------------------------------------
  sparrowx-threat-cache:
    image: redis:7-alpine
    container_name: sparrowx_threat_cache
    restart: always
    command: redis-server --appendonly yes --requirepass ${SPARROWX_REDIS_SECRET:-secret_redis_pass_123}
    volumes:
      - sparrowx_redis_data:/data
    networks:
      - sparrowx_net

  # ----------------------------------------------------------------------------
  # 5. SparrowX Web App & API Gateway (Port 80 & 3000 -> sec, db, and api.sparrowx.net)
  # ----------------------------------------------------------------------------
  sparrowx-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparrowx_studio
    restart: always
    ports:
      - "80:3000"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - POSTGREST_HOST=sparrowx-postgrest
      - POSTGREST_PORT=3000
      - POSTGREST_INTERNAL_URL=http://sparrowx-postgrest:3000
      - VITE_SPARROWX_API_URL=https://${DOMAIN_API:-api.sparrowx.net}
      - VITE_SPARROWX_WS_URL=wss://${DOMAIN_API:-api.sparrowx.net}/realtime
    networks:
      - sparrowx_net
    depends_on:
      - sparrowx-postgrest
