#!/usr/sbin/nft -f
# SparrowX AI Tenant Egress Guard — Protects OVH Mumbai Gateway IP Reputation
# Blocks outbound TCP port 25 (SMTP spam), port 465/587 unless allowlisted,
# and prevents tenant-to-tenant lateral scanning across 10.77.0.0/16.

table inet sparrowx_ai_egress {
    chain forward {
        type filter hook forward priority 0; policy accept;

        # Drop outbound raw SMTP from tenant bridge/VLAN to prevent OVH IP blacklisting
        ip saddr 10.77.0.0/16 tcp dport 25 counter log prefix "[SPX-SMTP-BLOCK] " drop

        # Isolate tenant subnets from probing Proxmox management VLAN or internal metadata
        ip saddr 10.77.0.0/16 ip daddr 169.254.169.254 counter drop
        ip saddr 10.77.0.0/16 ip daddr 10.77.0.0/16 ct state new counter drop

        # Allow established/related return traffic + DNS + HTTPS + db.sparrowx.net:5432
        ct state established,related accept
    }
}
