# ============================================================================
# SPARROWX DEPLOY (deploy.sparrowx.net) — PRODUCTION FULL-STACK COMPOSE
# ============================================================================
# Runs:
#   1. Control Plane (TanStack Start + Nitro SSR + REST/SSE APIs)
#   2. Build & Container Orchestration Worker (BullMQ + Railpack / BuildKit)
#   3. PostgreSQL 16 (Drizzle schema & encrypted AES-256-GCM env vault)
#   4. Redis 7 (BullMQ job queue + Pub/Sub SSE live log streaming)
#   5. Caddy 2 Edge Reverse Proxy (Admin API + On-Demand Let's Encrypt TLS)
# ============================================================================

networks:
  sparrowx_control:
    name: sparrowx_control
    driver: bridge
  sparrowx_apps:
    name: sparrowx_apps
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: sparrowx-deploy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sparrowx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sparrowx_db}
    volumes:
      - deploy_pgdata:/var/lib/postgresql/data
      - ./drizzle/0001_sparrowx_deploy_init.sql:/docker-entrypoint-initdb.d/01-deploy.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sparrowx} -d ${POSTGRES_DB:-sparrowx_db}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - sparrowx_control

  redis:
    image: redis:7-alpine
    container_name: sparrowx-deploy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - deploy_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sparrowx_control

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparrowx-deploy-control
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sparrowx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sparrowx_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-sparrowx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sparrowx_db}
      REDIS_URL: redis://redis:6379
      SPARROWX_DOMAIN: ${SPARROWX_DOMAIN:-sparrowx.net}
      SPARROWX_PUBLIC_IP: ${SPARROWX_PUBLIC_IP:-139.99.131.135}
      SPARROWX_MASTER_SSO_SECRET: ${SPARROWX_MASTER_SSO_SECRET:?SPARROWX_MASTER_SSO_SECRET is required}
      SPARROWX_JWT_SECRET: ${SPARROWX_JWT_SECRET:?SPARROWX_JWT_SECRET is required}
      SPARROWX_ENCRYPTION_KEY: ${SPARROWX_ENCRYPTION_KEY:?SPARROWX_ENCRYPTION_KEY is required}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CADDY_ADMIN_URL: http://caddy:2019
    networks:
      - sparrowx_control
      - sparrowx_apps

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparrowx-deploy-worker
    restart: unless-stopped
    command: ["npx", "tsx", "worker/deploy-worker.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DOCKER_BUILDKIT: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-sparrowx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sparrowx_db}
      REDIS_URL: redis://redis:6379
      SPARROWX_DOMAIN: ${SPARROWX_DOMAIN:-sparrowx.net}
      SPARROWX_APPS_NETWORK: sparrowx_apps
      SPARROWX_ENCRYPTION_KEY: ${SPARROWX_ENCRYPTION_KEY:?SPARROWX_ENCRYPTION_KEY is required}
      SPARROWX_WORKER_CONCURRENCY: ${SPARROWX_WORKER_CONCURRENCY:-2}
      CADDY_ADMIN_URL: http://caddy:2019
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sparrowx_control
      - sparrowx_apps

  caddy:
    image: caddy:2.9-alpine
    container_name: sparrowx-deploy-caddy
    restart: unless-stopped
    depends_on:
      - control-plane
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile.deploy:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sparrowx_control
      - sparrowx_apps

volumes:
  deploy_pgdata:
  deploy_redisdata:
  caddy_data:
  caddy_config:
