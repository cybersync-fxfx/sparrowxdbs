# ============================================================================
# SPARROWX OVH UBUNTU NGINX REVERSE PROXY
# ============================================================================
# Routes both the UI/API and /rest/v1/* database endpoints through a single
# sovereign domain on your OVH server.
# ============================================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 150M;
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Self-Hosted PostgREST Database API (/rest/v1/*)
    location /rest/v1/ {
        set $upstream_app http://sparrowx:3000;
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @sparrowx_host_fallback;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, apikey, Prefer, x-sparrowx-key" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # 2. SparrowX UI, SSR & Ingestion API (/api/v1/*)
    location / {
        set $upstream_app http://sparrowx:3000;
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @sparrowx_host_fallback;
    }

    location @sparrowx_host_fallback {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
